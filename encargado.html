<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ecovasos — Encargado</title>
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ecovasos">
<meta name="theme-color" content="#BA7517">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f3;--bg3:#eeecea;
  --text:#1a1a18;--text2:#5f5e5a;--text3:#888780;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.25);
  --radius:8px;--radius-lg:12px;
  --amber:#BA7517;--amber-bg:#FAEEDA;--amber-text:#633806;
  --green:#3B6D11;--green-bg:#EAF3DE;--green-text:#27500A;
  --red:#A32D2D;--red-bg:#FCEBEB;--red-text:#791F1F;
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue-text:#0C447C;
  --teal:#0F6E56;--teal-bg:#E1F5EE;--teal-text:#085041;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1e1e1c;--bg2:#2a2a28;--bg3:#323230;
  --text:#f0ede8;--text2:#b4b2a9;--text3:#888780;
  --border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.25);
  --amber:#EF9F27;--amber-bg:#412402;--amber-text:#FAC775;
  --green:#97C459;--green-bg:#173404;--green-text:#C0DD97;
  --red:#E24B4A;--red-bg:#501313;--red-text:#F7C1C1;
  --blue:#378ADD;--blue-bg:#042C53;--blue-text:#B5D4F4;
  --teal:#1D9E75;--teal-bg:#04342C;--teal-text:#9FE1CB;
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);font-size:15px;min-height:100vh}

nav{background:var(--bg);border-bottom:0.5px solid var(--border);padding:0 1rem;display:flex;align-items:center;position:sticky;top:0;z-index:100}
.nav-brand{font-size:14px;font-weight:500;padding:.8rem 0;margin-right:1rem}
.nav-tabs{display:flex;flex:1}
.nav-tab{padding:.8rem .75rem;font-size:13px;color:var(--text2);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.nav-tab.active{color:var(--amber);border-bottom-color:var(--amber);font-weight:500}
.sync-pill{margin-left:auto;font-size:11px;padding:.3rem .6rem;border-radius:20px;background:var(--bg2);display:flex;align-items:center;gap:4px}
.sync-pill.ok{color:var(--green)}.sync-pill.off{color:var(--text3)}.sync-pill.pend{color:var(--amber)}

main{max-width:520px;margin:0 auto;padding:1rem}

.metrics-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:1rem}
.metric{background:var(--bg);border-radius:var(--radius);padding:.875rem;text-align:center;border:0.5px solid var(--border)}
.metric-label{font-size:11px;color:var(--text3);margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
.metric-value{font-size:20px;font-weight:500}
.metric-value.amber{color:var(--amber)}.metric-value.green{color:var(--green)}

.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1rem}

label{font-size:13px;color:var(--text2);display:block;margin-bottom:3px}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:.5rem .75rem;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none}
input:focus,select:focus{box-shadow:0 0 0 2px var(--amber);border-color:var(--amber)}
.form-row{margin-bottom:.875rem}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}

button{font-family:inherit;font-size:14px;cursor:pointer;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);padding:.5rem .9rem;transition:background .15s,transform .1s}
button:hover{background:var(--bg2)}
button:active{transform:scale(.98)}
button.primary{background:var(--amber-bg);border-color:var(--amber);color:var(--amber-text);font-weight:500}
button.success{background:var(--green-bg);border-color:var(--green);color:var(--green-text);font-weight:500}
button.sm{padding:.3rem .65rem;font-size:12px}
button:disabled{opacity:.35;cursor:not-allowed}

.qty-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:.25rem}
.qty-btn{padding:.55rem .25rem;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:12px;cursor:pointer;text-align:center;transition:all .15s}
.qty-btn.selected{background:var(--amber-bg);border-color:var(--amber);color:var(--amber-text);font-weight:500}

#sig-canvas{border:1px dashed var(--border2);border-radius:var(--radius);background:#fff;width:100%;height:140px;touch-action:none;cursor:crosshair;display:block}

.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:var(--radius);font-size:11px;font-weight:500}
.badge.amber{background:var(--amber-bg);color:var(--amber-text)}
.badge.green{background:var(--green-bg);color:var(--green-text)}
.badge.blue{background:var(--blue-bg);color:var(--blue-text)}
.badge.teal{background:var(--teal-bg);color:var(--teal-text)}
.badge.red{background:var(--red-bg);color:var(--red-text)}

.cobro-box{background:var(--green-bg);border:0.5px solid var(--green);border-radius:var(--radius);padding:.875rem;margin-bottom:.875rem}
.cobro-title{font-size:12px;color:var(--green-text);font-weight:500;margin-bottom:.5rem}
.cobro-monto{font-size:20px;font-weight:500;color:var(--green-text)}
.cobro-detail{font-size:11px;color:var(--green);margin-top:.25rem}
.cobro-check{display:flex;align-items:center;gap:.5rem;margin-top:.75rem;cursor:pointer}
.cobro-check input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
.cobro-check label{font-size:13px;color:var(--green-text);cursor:pointer;margin:0}

.hist-item{display:flex;align-items:center;justify-content:space-between;padding:.65rem 0;border-bottom:0.5px solid var(--border)}
.hist-item:last-child{border-bottom:none}
.hist-stand{font-size:14px;font-weight:500}
.hist-meta{font-size:11px;color:var(--text3);margin-top:1px}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-bg.open{display:flex}
.modal{background:var(--bg);border-radius:var(--radius-lg);border:0.5px solid var(--border);padding:1.5rem;width:min(480px,100%);max-height:88vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.liq-row{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:0.5px solid var(--border);font-size:14px}
.liq-row:last-child{border-bottom:none}

.text-muted{color:var(--text3)}.text-sm{font-size:12px}
.mt-1{margin-top:.5rem}.mt-2{margin-top:1rem}
.flex{display:flex}.gap-1{gap:.5rem}.gap-2{gap:.75rem}.items-center{align-items:center}.flex-wrap{flex-wrap:wrap}
.empty-state{text-align:center;padding:2rem 1rem;color:var(--text3)}
</style>
</head>
<body>

<nav>
  <span class="nav-brand"><i class="ti ti-beer" aria-hidden="true"></i> Ecovasos</span>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showTab('registrar')"><i class="ti ti-plus"></i> Registrar</button>
    <button class="nav-tab" onclick="showTab('entregas')"><i class="ti ti-list"></i> Mis entregas</button>
  </div>
  <div class="sync-pill off" id="sync-pill">
    <i class="ti ti-cloud-off" id="sync-icon"></i>
  </div>
</nav>

<main>

<!-- TAB REGISTRAR -->
<div id="tab-registrar">
  <div class="metrics-grid" id="metrics"></div>

  <div class="card">
    <div class="form-row">
      <label>Tipo de movimiento</label>
      <select id="mov-tipo" onchange="onTipoChange()">
        <option value="entrega">Entrega inicial</option>
        <option value="reposicion">Reposición</option>
        <option value="devolucion">Devolución al cierre</option>
      </select>
    </div>

    <div class="form-row">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.35rem">
        <label style="margin:0">Stand</label>
        <span style="font-size:11px;padding:2px 8px;background:var(--amber-bg);color:var(--amber-text);border-radius:20px;font-weight:500"><i class="ti ti-calendar-event"></i> Día 2 — Dom 31/05</span>
      </div>
      <input type="hidden" id="mov-dia" value="2">
      <select id="mov-stand" onchange="onStandChange()">
        <option value="">— Seleccionar —</option>
      </select>
    </div>

    <!-- Cantidad (entrega/repos) -->
    <div id="row-cantidad" class="form-row">
      <label>Cantidad</label>
      <div class="qty-grid">
        <button class="qty-btn" onclick="selectQty(50,this)">¼ caja<br><small>50u</small></button>
        <button class="qty-btn" onclick="selectQty(100,this)">½ caja<br><small>100u</small></button>
        <button class="qty-btn selected" onclick="selectQty(200,this)">1 caja<br><small>200u</small></button>
        <button class="qty-btn" onclick="selectQty('custom',this)">Otro<br><small>cajas</small></button>
      </div>
      <div id="custom-row" style="display:none;margin-top:.5rem;display:none">
        <input type="number" id="custom-input" min="1" placeholder="Cantidad de cajas" oninput="onCustomQty()">
      </div>
      <div id="qty-summary" class="text-sm text-muted" style="margin-top:.4rem">Total: 200 vasos</div>
    </div>

    <!-- Devolución -->
    <div id="row-devolucion" class="form-row" style="display:none">
      <label>Vasos devueltos (unidades)</label>
      <input type="number" id="mov-unidades" min="0" placeholder="Ej: 30" oninput="updateDevPreview()">
      <div id="dev-preview" class="text-sm text-muted" style="margin-top:.4rem"></div>
    </div>

    <!-- COBRO EN REPOSICION -->
    <div id="row-cobro" style="display:none">
      <div class="cobro-box" id="cobro-box">
        <div class="cobro-title"><i class="ti ti-coin" aria-hidden="true"></i> Cobro de entregas anteriores</div>
        <div class="cobro-monto" id="cobro-monto">$0</div>
        <div class="cobro-detail" id="cobro-detail"></div>
        <div class="cobro-check">
          <input type="checkbox" id="cobro-check">
          <label for="cobro-check">Confirmar cobro en efectivo</label>
        </div>
      </div>
    </div>

    <div class="form-row">
      <label>WhatsApp expositor <span class="text-muted">(sin 0, sin 15)</span></label>
      <div style="display:flex;gap:0">
        <span style="padding:.5rem .6rem;border:0.5px solid var(--border2);border-right:none;border-radius:var(--radius) 0 0 var(--radius);background:var(--bg2);font-size:13px;color:var(--text2);white-space:nowrap">+54 9</span>
        <input type="tel" id="mov-whatsapp" placeholder="3814123456" style="border-radius:0 var(--radius) var(--radius) 0">
      </div>
    </div>

    <div class="form-row">
      <label>Notas (opcional)</label>
      <input type="text" id="mov-notas" placeholder="Observaciones...">
    </div>

    <div class="form-row">
      <label>Firma del expositor</label>
      <canvas id="sig-canvas"></canvas>
      <div style="display:flex;gap:.5rem;margin-top:.4rem;align-items:center">
        <button class="sm" onclick="clearSig()"><i class="ti ti-eraser"></i> Limpiar</button>
        <span id="sig-status" class="text-sm text-muted"></span>
      </div>
    </div>

    <button class="primary" onclick="registrar()" style="width:100%;padding:.65rem">
      <i class="ti ti-check"></i> Confirmar y generar remito
    </button>
  </div>
</div>

<!-- TAB MIS ENTREGAS -->
<div id="tab-entregas" style="display:none">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.875rem">
      <h2 style="font-size:16px;font-weight:500">Mis entregas — Día 2</h2>
      <span style="font-size:11px;padding:2px 8px;background:var(--amber-bg);color:var(--amber-text);border-radius:20px;font-weight:500">Dom 31/05</span>
    </div>
    <div id="entregas-list"></div>
  </div>
</div>

</main>

<!-- MODAL REMITO -->
<div class="modal-bg" id="modal-remito">
  <div class="modal">
    <div class="modal-header">
      <h2 style="font-size:16px"><i class="ti ti-file-check"></i> Remito generado</h2>
      <button onclick="closeModal()" style="border:none;background:none;font-size:20px;cursor:pointer;padding:0"><i class="ti ti-x"></i></button>
    </div>
    <div id="remito-preview"></div>
    <div class="flex gap-2 mt-2 flex-wrap" style="margin-top:1rem">
      <button class="primary" onclick="descargarPDF()"><i class="ti ti-download"></i> PDF</button>
      <button class="success" onclick="enviarWhatsApp()"><i class="ti ti-brand-whatsapp"></i> WhatsApp</button>
      <button onclick="closeModal()">Cerrar</button>
    </div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBh8qNXKxAQL5DMfDfxKt3gvZrLOM1MpexxF0egRC6AGvdXV0OK1x0UWRMLaYaPU7G0g/exec";

const STANDS = [
  "338 Cerveceria","Infiernillo Cerveceria","BDC","Barbero Cerveceria",
  "Cerveza Novac","Cerveza Masha","Wayna Cerveceria","Caciques Cerveceria",
  "Walnus Cerveceria","TBC Cerveceria","Beet Cerveceria","Pal Rancho Cerveceria",
  "Viejo Amargo","Paralelo 42","Carpa Boliche Birrafest",
  "Bierport — Stand","Bierport — Carpa","Jonais — Stand","Jonais — Carpa",
  "Producción Central"
];

const BONIF_STANDS = [
  "Beet Cerveceria","Walnus Cerveceria","Cerveza Novac","Wayna Cerveceria",
  "Paralelo 42","TBC Cerveceria","Bierport — Stand","Bierport — Carpa",
  "Caciques Cerveceria","Barbero Cerveceria"
];

const PRECIO_NORMAL = 2000;
const PRECIO_BONIF = 1500;
const UMBRAL_BONIF = 100;

let state = { movimientos: [], syncQueue: [] };
let selectedUnits = 200;
let sigCanvas, sigCtx, drawing = false, hasSig = false;
let pendingRemito = null;

function loadState(){
  try{ const s=localStorage.getItem("ecovasos_v3"); if(s) state=JSON.parse(s); }catch(e){}
  populateStands();
}
function saveState(){
  localStorage.setItem("ecovasos_v3", JSON.stringify(state));
  scheduleSync();
}

function fmt(n){ return Math.round(n).toLocaleString("es-AR"); }
function fmtM(n){ return "$"+fmt(n); }
function fmtDate(ts){ return new Date(ts).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }

function calcMonto(stand, unidadesVendidas){
  if(BONIF_STANDS.includes(stand)){
    const bonif = Math.min(unidadesVendidas, UMBRAL_BONIF);
    const normal = Math.max(0, unidadesVendidas - UMBRAL_BONIF);
    return bonif * PRECIO_BONIF + normal * PRECIO_NORMAL;
  }
  return unidadesVendidas * PRECIO_NORMAL;
}

function getStandMovs(stand, dia){
  return state.movimientos.filter(m => m.stand===stand && (dia===0||m.dia===dia));
}

function getStandEntregado(stand, dia){
  return getStandMovs(stand,dia).filter(m=>m.tipo!=="devolucion"&&m.tipo!=="cobro_parcial").reduce((a,m)=>a+m.unidades,0);
}

function getStandCobrado(stand, dia){
  return getStandMovs(stand,dia).filter(m=>m.tipo==="cobro_parcial"||m.cobrado).reduce((a,m)=>a+(m.montoCobrado||0),0);
}

function calcCobroPendiente(stand, dia){
  const entregado = getStandEntregado(stand, dia);
  const cobrado = getStandCobrado(stand, dia);
  const montoPorEntregado = calcMonto(stand, entregado);
  return Math.max(0, montoPorEntregado - cobrado);
}

function populateStands(){
  const sel = document.getElementById("mov-stand");
  sel.innerHTML = '<option value="">— Seleccionar —</option>';
  STANDS.forEach(s=>{ const o=document.createElement("option"); o.value=s; o.textContent=s; sel.appendChild(o); });
}

function showTab(t){
  document.getElementById("tab-registrar").style.display = t==="registrar"?"block":"none";
  document.getElementById("tab-entregas").style.display = t==="entregas"?"block":"none";
  document.querySelectorAll(".nav-tab").forEach((b,i)=>b.classList.toggle("active",["registrar","entregas"][i]===t));
  if(t==="registrar") renderMetrics();
  if(t==="entregas") renderEntregas();
}

function renderMetrics(){
  const dia = 2;
  const movs = state.movimientos.filter(m=>m.dia===dia);
  const entregas = movs.filter(m=>m.tipo==="entrega").length;
  const repos = movs.filter(m=>m.tipo==="reposicion").length;
  const devols = movs.filter(m=>m.tipo==="devolucion").length;
  const vasos = movs.filter(m=>m.tipo!=="devolucion"&&m.tipo!=="cobro_parcial").reduce((a,m)=>a+m.unidades,0);
  document.getElementById("metrics").innerHTML=`
    <div class="metric"><div class="metric-label">Entregas</div><div class="metric-value amber">${entregas}</div></div>
    <div class="metric"><div class="metric-label">Vasos entregados</div><div class="metric-value">${fmt(vasos)}</div></div>
    <div class="metric"><div class="metric-label">Reposiciones</div><div class="metric-value">${repos}</div></div>
    <div class="metric"><div class="metric-label">Devoluciones</div><div class="metric-value green">${devols}</div></div>
  `;
}

function onTipoChange(){
  const tipo = document.getElementById("mov-tipo").value;
  document.getElementById("row-cantidad").style.display = tipo==="devolucion"?"none":"block";
  document.getElementById("row-devolucion").style.display = tipo==="devolucion"?"block":"none";
  document.getElementById("row-cobro").style.display = tipo==="reposicion"?"block":"none";
  if(tipo==="reposicion") updateCobroPendiente();
}

function onStandChange(){
  const tipo = document.getElementById("mov-tipo").value;
  if(tipo==="reposicion") updateCobroPendiente();
  if(tipo==="devolucion") updateDevPreview();
}

function updateCobroPendiente(){
  const stand = document.getElementById("mov-stand").value;
  const dia = +document.getElementById("mov-dia").value;
  if(!stand) return;
  const pendiente = calcCobroPendiente(stand, dia);
  const entregado = getStandEntregado(stand, dia);
  document.getElementById("cobro-monto").textContent = fmtM(pendiente);
  document.getElementById("cobro-detail").textContent = `${fmt(entregado)} vasos entregados hasta ahora`;
  document.getElementById("cobro-check").checked = false;
}

function updateDevPreview(){
  const stand = document.getElementById("mov-stand").value;
  const dia = +document.getElementById("mov-dia").value;
  const devueltos = +document.getElementById("mov-unidades").value || 0;
  if(!stand){ document.getElementById("dev-preview").textContent=""; return; }
  const entregado = getStandEntregado(stand, dia);
  const vendidos = Math.max(0, entregado - devueltos);
  const monto = calcMonto(stand, vendidos);
  document.getElementById("dev-preview").textContent = `Entregados: ${fmt(entregado)}u — Vendidos: ${fmt(vendidos)}u — Total: ${fmtM(monto)}`;
}

function selectQty(val, btn){
  document.querySelectorAll(".qty-btn").forEach(b=>b.classList.remove("selected"));
  btn.classList.add("selected");
  const cr = document.getElementById("custom-row");
  if(val==="custom"){
    cr.style.display="block";
    selectedUnits = 0;
    document.getElementById("qty-summary").textContent="Ingresá cantidad de cajas";
  } else {
    cr.style.display="none";
    selectedUnits = val;
    document.getElementById("qty-summary").textContent=`Total: ${fmt(val)} vasos`;
  }
  if(document.getElementById("mov-tipo").value==="reposicion") updateCobroPendiente();
}

function onCustomQty(){
  const v = +document.getElementById("custom-input").value;
  if(v>0){ selectedUnits=v*200; document.getElementById("qty-summary").textContent=`${v} cajas = ${fmt(selectedUnits)} vasos`; }
}

function registrar(){
  const tipo = document.getElementById("mov-tipo").value;
  const dia = +document.getElementById("mov-dia").value;
  const stand = document.getElementById("mov-stand").value;
  const notas = document.getElementById("mov-notas").value.trim();
  const whatsapp = document.getElementById("mov-whatsapp").value.trim().replace(/\D/g,"");

  if(!stand){ alert("Seleccioná un stand."); return; }
  if(!hasSig){ alert("El expositor debe firmar."); return; }

  if(tipo==="reposicion"){
    const pendiente = calcCobroPendiente(stand, dia);
    if(pendiente > 0 && !document.getElementById("cobro-check").checked){
      alert("Confirmá el cobro en efectivo antes de continuar."); return;
    }
  }

  const sigData = sigCanvas.toDataURL("image/png");
  let mov = { id:Date.now(), ts:Date.now(), tipo, dia, stand, notas, whatsapp, firma:sigData };

  if(tipo==="devolucion"){
    const u = +document.getElementById("mov-unidades").value;
    if(isNaN(u)||u<0){ alert("Ingresá los vasos devueltos."); return; }
    mov.unidades = u;
    const entregado = getStandEntregado(stand, dia);
    const vendidos = Math.max(0, entregado - u);
    const cobradoPrev = getStandCobrado(stand, dia);
    const montoFinal = Math.max(0, calcMonto(stand, vendidos) - cobradoPrev);
    mov.montoCobrado = montoFinal;
    mov.vendidos = vendidos;
  } else {
    if(!selectedUnits){ alert("Seleccioná la cantidad."); return; }
    mov.unidades = selectedUnits;
    if(tipo==="reposicion"){
      const pendiente = calcCobroPendiente(stand, dia);
      mov.montoCobrado = pendiente;
      mov.cobrado = true;
    }
  }

  state.movimientos.push(mov);
  state.syncQueue.push(mov.id);
  saveState();
  pendingRemito = mov;
  mostrarRemito(mov);
  limpiarForm();
}

function limpiarForm(){
  document.getElementById("mov-stand").value="";
  document.getElementById("mov-notas").value="";
  document.getElementById("mov-whatsapp").value="";
  document.getElementById("mov-unidades").value="";
  document.getElementById("dev-preview").textContent="";
  document.getElementById("cobro-check").checked=false;
  selectQty(200, document.querySelectorAll(".qty-btn")[2]);
  clearSig();
  renderMetrics();
}

function mostrarRemito(mov){
  const tipoLabel={entrega:"Entrega inicial",reposicion:"Reposición + Cobro",devolucion:"Devolución al cierre"};
  const tipoClass={entrega:"amber",reposicion:"blue",devolucion:"teal"};
  const entregado = getStandEntregado(mov.stand, mov.dia);

  let detalleHTML = "";
  if(mov.tipo==="devolucion"){
    const cobradoPrev = getStandCobrado(mov.stand, mov.dia) - (mov.montoCobrado||0);
    detalleHTML = `
      <div class="liq-row"><span class="text-muted">Vasos devueltos</span><span>${fmt(mov.unidades)}</span></div>
      <div class="liq-row"><span class="text-muted">Vasos vendidos</span><span><strong>${fmt(mov.vendidos||0)}</strong></span></div>
      <div class="liq-row"><span class="text-muted">Cobrado previamente</span><span>${fmtM(cobradoPrev)}</span></div>
      <div class="liq-row"><span class="text-muted">Cobro final</span><span style="color:var(--green)"><strong>${fmtM(mov.montoCobrado||0)}</strong></span></div>`;
  } else if(mov.tipo==="reposicion"){
    detalleHTML = `
      <div class="liq-row"><span class="text-muted">Vasos cobrados</span><span>${fmt(entregado - mov.unidades)} (entrega anterior)</span></div>
      <div class="liq-row"><span class="text-muted">Monto cobrado</span><span style="color:var(--green)"><strong>${fmtM(mov.montoCobrado||0)}</strong></span></div>
      <div class="liq-row"><span class="text-muted">Nueva entrega</span><span>${fmt(mov.unidades)} vasos</span></div>`;
  } else {
    detalleHTML = `<div class="liq-row"><span class="text-muted">Vasos entregados</span><span>${fmt(mov.unidades)}</span></div>`;
  }

  document.getElementById("remito-preview").innerHTML=`
    <div style="border:0.5px solid var(--border);border-radius:var(--radius);padding:1.25rem">
      <div style="display:flex;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem">
        <div><strong style="font-size:15px">BirraFest VII — Ecovasos</strong><br><span class="text-sm text-muted">Remito N° ${mov.id}</span></div>
        <div style="text-align:right"><span class="badge ${tipoClass[mov.tipo]}">${tipoLabel[mov.tipo]}</span><br><span class="text-sm text-muted">${fmtDate(mov.ts)}</span></div>
      </div>
      <div class="liq-row"><span class="text-muted">Stand</span><strong>${mov.stand}</strong></div>
      <div class="liq-row"><span class="text-muted">Día</span><span>Día ${mov.dia}</span></div>
      ${detalleHTML}
      ${mov.notas?`<div class="liq-row"><span class="text-muted">Notas</span><span>${mov.notas}</span></div>`:""}
      ${mov.whatsapp?`<div class="liq-row"><span class="text-muted">WhatsApp</span><span>+54 9 ${mov.whatsapp}</span></div>`:""}
      <div style="margin-top:1rem;border-top:0.5px solid var(--border);padding-top:.875rem">
        <div class="text-sm text-muted" style="margin-bottom:.4rem">Firma del expositor</div>
        <img src="${mov.firma}" style="max-width:100%;height:70px;border:0.5px solid var(--border);border-radius:var(--radius);background:#fff">
      </div>
    </div>`;
  document.getElementById("modal-remito").classList.add("open");
}

function descargarPDF(){
  if(!pendingRemito) return;
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a5"});
  const mov=pendingRemito;
  const tipoLabel={entrega:"Entrega inicial",reposicion:"Reposición + Cobro",devolucion:"Devolución al cierre"};
  doc.setFontSize(13); doc.setFont(undefined,"bold");
  doc.text("BirraFest VII — Ecovasos",15,18);
  doc.setFontSize(9); doc.setFont(undefined,"normal");
  doc.text(`Remito N° ${mov.id}`,15,24);
  doc.setFontSize(10); doc.setFont(undefined,"bold");
  doc.text(tipoLabel[mov.tipo],133,18,{align:"right"});
  doc.setFontSize(9); doc.setFont(undefined,"normal");
  doc.text(fmtDate(mov.ts),133,24,{align:"right"});
  doc.setDrawColor(200); doc.line(15,27,133,27);
  const rows=[["Stand",mov.stand],["Día",`Día ${mov.dia}`]];
  if(mov.tipo==="devolucion"){
    rows.push(["Vasos devueltos",`${fmt(mov.unidades)} u`]);
    rows.push(["Vasos vendidos",`${fmt(mov.vendidos||0)} u`]);
    rows.push(["Cobro final",fmtM(mov.montoCobrado||0)]);
  } else if(mov.tipo==="reposicion"){
    rows.push(["Cobro efectivo",fmtM(mov.montoCobrado||0)]);
    rows.push(["Nueva entrega",`${fmt(mov.unidades)} vasos`]);
  } else {
    rows.push(["Vasos entregados",`${fmt(mov.unidades)} u`]);
  }
  if(mov.notas) rows.push(["Notas",mov.notas]);
  let y=35;
  rows.forEach(([k,v])=>{ doc.setFont(undefined,"normal"); doc.setTextColor(120); doc.text(k,15,y); doc.setFont(undefined,"bold"); doc.setTextColor(30); doc.text(v,60,y); y+=8; });
  doc.setDrawColor(200); doc.line(15,y+2,133,y+2); y+=10;
  doc.setFontSize(9); doc.setFont(undefined,"normal"); doc.setTextColor(120); doc.text("Firma del expositor:",15,y); y+=4;
  try{ doc.addImage(mov.firma,"PNG",15,y,70,25); y+=29; }catch(e){}
  doc.setDrawColor(180); doc.line(15,y+4,85,y+4);
  doc.setFontSize(8); doc.setTextColor(150); doc.text("Aclaración",15,y+9);
  doc.save(`remito_${mov.stand.replace(/[\s—]+/g,"_")}_${mov.id}.pdf`);
}

function enviarWhatsApp(){
  if(!pendingRemito) return;
  const mov=pendingRemito;
  const tipoLabel={entrega:"Entrega inicial",reposicion:"Reposición + Cobro",devolucion:"Devolución al cierre"};
  let detalle="";
  if(mov.tipo==="reposicion") detalle=`*Cobro:* ${fmtM(mov.montoCobrado||0)}\n*Nueva entrega:* ${fmt(mov.unidades)} vasos`;
  else if(mov.tipo==="devolucion") detalle=`*Vendidos:* ${fmt(mov.vendidos||0)} vasos\n*Cobro final:* ${fmtM(mov.montoCobrado||0)}`;
  else detalle=`*Vasos entregados:* ${fmt(mov.unidades)}`;
  const texto=`*BirraFest VII — Ecovasos*\nRemito N° ${mov.id}\n${tipoLabel[mov.tipo]} — Día ${mov.dia}\n*Stand:* ${mov.stand}\n${detalle}\n_${fmtDate(mov.ts)}_`;
  const encoded=encodeURIComponent(texto);
  window.open(mov.whatsapp?`https://wa.me/549${mov.whatsapp}?text=${encoded}`:`https://wa.me/?text=${encoded}`);
}

function closeModal(){ document.getElementById("modal-remito").classList.remove("open"); }

function renderEntregas(){
  const dia = 2;
  const container = document.getElementById("entregas-list");
  const standsConMovs = [...new Set(state.movimientos.filter(m=>m.dia===dia).map(m=>m.stand))];
  if(!standsConMovs.length){
    container.innerHTML='<div class="empty-state"><i class="ti ti-clipboard-list"></i><br>Sin movimientos hoy</div>';
    return;
  }
  const tipoLabel={entrega:"Entrega",reposicion:"Reposición",devolucion:"Devol."};
  const tipoClass={entrega:"amber",reposicion:"blue",devolucion:"teal"};

  container.innerHTML = standsConMovs.map(stand => {
    const movs = state.movimientos.filter(m=>m.dia===dia&&m.stand===stand);
    const entregado = getStandEntregado(stand, dia);
    const cobrado = getStandCobrado(stand, dia);
    const pendiente = calcCobroPendiente(stand, dia);
    const liquidado = movs.some(m=>m.tipo==="devolucion");
    const whatsapp = (movs.find(m=>m.whatsapp)||{}).whatsapp || "";
    const sid = "stand_" + stand.replace(/[^a-zA-Z0-9]/g,"_");

    const msgEstado = "*BirraFest VII — Estado de cuenta*%0A" +
      "Stand: *" + stand + "*%0A" +
      "Vasos entregados: " + fmt(entregado) + "%0A" +
      "Cobrado hasta ahora: " + fmtM(cobrado) + "%0A" +
      "*Saldo pendiente: " + fmtM(pendiente) + "*%0A" +
      "_Por favor preparar el pago en efectivo_";
    const waLink = whatsapp
      ? "https://wa.me/549" + whatsapp + "?text=" + msgEstado
      : "https://wa.me/?text=" + msgEstado;

    const movsList = movs.map(m=>
      '<div style="display:flex;justify-content:space-between;align-items:center;padding:.35rem 0;border-bottom:0.5px solid var(--border)">' +
        '<div><span class="badge ' + (tipoClass[m.tipo]||"amber") + '" style="margin-right:.35rem">' + (tipoLabel[m.tipo]||m.tipo) + '</span>' +
        '<span class="text-sm">' + fmt(m.unidades||0) + 'u' + (m.montoCobrado?' · Cobro: '+fmtM(m.montoCobrado):"") + '</span></div>' +
        '<div style="display:flex;gap:.35rem;align-items:center">' +
          '<span class="text-sm text-muted">' + fmtDate(m.ts) + '</span>' +
          '<button class="sm" onclick="event.stopPropagation();verRemito(' + m.id + ')"><i class="ti ti-file-text"></i></button>' +
        '</div>' +
      '</div>'
    ).join("");

    return '<div style="border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:.5rem;overflow:hidden">' +
      '<div onclick="toggleStand(\'' + sid + '\')" style="display:flex;justify-content:space-between;align-items:center;padding:.75rem;cursor:pointer;background:var(--bg)">' +
        '<div>' +
          '<div style="font-weight:500;font-size:14px">' + stand + '</div>' +
          '<div class="text-sm text-muted">Entregado: ' + fmt(entregado) + 'u · Saldo: ' + fmtM(pendiente) + '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:.5rem">' +
          '<span class="badge ' + (liquidado?"green":"amber") + '">' + (liquidado?"Liquid.":"Pendiente") + '</span>' +
          '<i class="ti ti-chevron-down" style="color:var(--text3);font-size:14px"></i>' +
        '</div>' +
      '</div>' +
      '<div id="' + sid + '" style="display:none;padding:.75rem;border-top:0.5px solid var(--border);background:var(--bg2)">' +
        '<div style="background:var(--bg);border-radius:var(--radius);padding:.75rem;margin-bottom:.75rem">' +
          '<div style="font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.5rem">Estado de cuenta</div>' +
          '<div class="liq-row"><span class="text-muted">Vasos entregados</span><span>' + fmt(entregado) + '</span></div>' +
          '<div class="liq-row"><span class="text-muted">Cobrado</span><span style="color:var(--green)">' + fmtM(cobrado) + '</span></div>' +
          '<div class="liq-row"><span class="text-muted" style="font-weight:500">Saldo pendiente</span><span style="color:var(--' + (pendiente>0?"red":"green") + ');font-weight:500">' + fmtM(pendiente) + '</span></div>' +
        '</div>' +
        '<button class="success" onclick="window.open(\'' + waLink + '\')" style="width:100%;margin-bottom:.75rem">' +
          '<i class="ti ti-brand-whatsapp"></i> Enviar estado de cuenta' +
        '</button>' +
        '<div style="margin-top:.25rem">' + movsList + '</div>' +
      '</div>' +
    '</div>';
  }).join("");
}

function toggleStand(id){
  const el = document.getElementById(id);
  if(el) el.style.display = el.style.display==="none"?"block":"none";
}

function verRemito(id){
  pendingRemito = state.movimientos.find(m=>m.id===id);
  if(pendingRemito) mostrarRemito(pendingRemito);
}

/* Signature */
function initSig(){
  sigCanvas=document.getElementById("sig-canvas");
  sigCtx=sigCanvas.getContext("2d");
  function resize(){ sigCanvas.width=sigCanvas.offsetWidth||460; sigCanvas.height=140; }
  resize(); window.addEventListener("resize",resize);
  function getPos(e){ const r=sigCanvas.getBoundingClientRect(); const s=e.touches?e.touches[0]:e; return{x:(s.clientX-r.left)*(sigCanvas.width/r.width),y:(s.clientY-r.top)*(sigCanvas.height/r.height)}; }
  function start(e){ e.preventDefault(); drawing=true; const p=getPos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); }
  function move(e){ e.preventDefault(); if(!drawing)return; const p=getPos(e); sigCtx.lineWidth=2.5; sigCtx.lineCap="round"; sigCtx.lineJoin="round"; sigCtx.strokeStyle="#1a1a18"; sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); hasSig=true; document.getElementById("sig-status").textContent="✓ Firma registrada"; }
  function end(){ drawing=false; }
  sigCanvas.addEventListener("mousedown",start); sigCanvas.addEventListener("mousemove",move); sigCanvas.addEventListener("mouseup",end);
  sigCanvas.addEventListener("touchstart",start,{passive:false}); sigCanvas.addEventListener("touchmove",move,{passive:false}); sigCanvas.addEventListener("touchend",end);
}
function clearSig(){ sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height); hasSig=false; document.getElementById("sig-status").textContent=""; }

/* Sync */
let syncTimer=null;
function scheduleSync(){ clearTimeout(syncTimer); syncTimer=setTimeout(syncPending,4000); }

async function syncPending(){
  if(!navigator.onLine||!state.syncQueue.length) return;
  const toSync=[...new Set(state.syncQueue)];
  const pending=state.movimientos.filter(m=>toSync.includes(m.id));
  setSyncUI("pend");
  const tipoLabel={entrega:"Entrega inicial",reposicion:"Reposición",devolucion:"Devolución"};
  for(const mov of pending){
    try{
      await fetch(APPS_SCRIPT_URL,{
        method:"POST", mode:"no-cors",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          timestamp:fmtDate(mov.ts), dia:`Día ${mov.dia}`, stand:mov.stand,
          tipo:tipoLabel[mov.tipo]||mov.tipo, unidades:mov.unidades,
          montoCobrado:mov.montoCobrado||"", vendidos:mov.vendidos||"",
          remitoId:mov.id, notas:mov.notas||"", whatsapp:mov.whatsapp||"",
          firma:mov.firma||""
        })
      });
      state.syncQueue=state.syncQueue.filter(id=>id!==mov.id);
    }catch(e){}
  }
  setSyncUI(state.syncQueue.length===0?"ok":"off");
  localStorage.setItem("ecovasos_v3",JSON.stringify(state));
}

function setSyncUI(s){
  const p=document.getElementById("sync-pill");
  const i=document.getElementById("sync-icon");
  if(s==="ok"){p.className="sync-pill ok";i.className="ti ti-cloud-check";}
  else if(s==="pend"){p.className="sync-pill pend";i.className="ti ti-cloud-upload";}
  else{p.className="sync-pill off";i.className="ti ti-cloud-off";}
}

window.addEventListener("online",()=>syncPending());
window.addEventListener("offline",()=>setSyncUI("off"));
window.addEventListener("DOMContentLoaded",()=>{
  loadState(); initSig(); renderMetrics();
  setSyncUI(navigator.onLine?"ok":"off");
  if(navigator.onLine) syncPending();
});
</script>
